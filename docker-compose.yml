version: '3.8'

services:
  backend:
    build: ./back
    container_name: flask-backend
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
    environment:
      - FLASK_ENV=development

  frontend:
    build: ./front
    container_name: react-frontend
    ports:
      - "8500:80"
    depends_on:
      - backend